<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CLIC Case – Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy:       #1a2e4a;
      --navy-dark:  #111f33;
      --navy-mid:   #243d5c;
      --gold:       #c9a84c;
      --gold-light: #e8c97a;
      --gold-pale:  #f5edda;
      --text:       #1c1c2e;
      --text-muted: #5a6275;
      --bg:         #f8f7f4;
      --white:      #ffffff;
      --border:     #ddd8ce;
      --sidebar-w:  240px;
      --radius:     6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
    }

    a { text-decoration: none; color: inherit; }

    .layout { display: flex; min-height: 100vh; }

    /* ====== SIDEBAR ====== */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--navy);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-brand {
      padding: 28px 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-brand .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5em;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .sidebar-brand .brand-sub {
      font-size: 0.72em;
      color: rgba(255,255,255,0.45);
      margin-top: 5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sidebar-nav { padding: 20px 0; flex: 1; }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 24px;
      font-size: 0.88em;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
      border-left: 3px solid transparent;
      cursor: pointer;
    }

    .sidebar-nav a:hover {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.9);
    }

    .sidebar-footer {
      padding: 16px 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-footer span {
      font-size: 0.68em;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ====== MAIN CONTENT ====== */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ====== PAGE HEADER ====== */
    .page-header {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 60%, #2a4a6e 100%);
      padding: 40px 48px 36px;
      position: relative;
      overflow: hidden;
    }

    .page-header::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 280px; height: 280px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.1);
      pointer-events: none;
    }

    .page-header .eyebrow {
      font-size: 0.72em;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.9em;
      font-weight: 700;
      color: var(--white);
      line-height: 1.2;
    }

    /* ====== CONTENT AREA ====== */
    .content-area {
      padding: 36px 48px;
      flex: 1;
      max-width: 880px;
    }

    /* ====== METADATA GRID ====== */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 28px;
    }

    .meta-cell {
      padding: 16px 20px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .meta-cell:last-child { border-right: none; }

    .meta-cell .meta-label {
      font-size: 0.72em;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 5px;
    }

    .meta-cell .meta-value {
      font-size: 0.95em;
      font-weight: 600;
      color: var(--text);
    }

    .meta-cell .meta-value a {
      color: var(--navy);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .meta-cell .meta-value a:hover { color: var(--gold); }

    /* Crime tags row */
    .crime-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .crime-tag {
      display: inline-block;
      font-size: 0.75em;
      font-weight: 600;
      letter-spacing: 0.04em;
      background: var(--gold-pale);
      color: var(--navy);
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 20px;
      padding: 3px 11px;
    }

    /* ====== ABSTRACT SECTION ====== */
    .section-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .section-card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-card-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1em;
      font-weight: 600;
      color: var(--navy);
    }

    .section-card-body {
      padding: 20px;
      font-size: 0.95em;
      line-height: 1.75;
      color: var(--text);
      text-align: justify;
      hyphens: auto;
    }

    /* ====== DOCUMENTS SECTION ====== */
    .doc-list { padding: 12px 20px; display: flex; flex-direction: column; gap: 8px; }

    .doc-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.15s, background 0.15s;
    }

    .doc-item:hover {
      border-color: var(--navy);
      background: var(--gold-pale);
    }

    .doc-icon {
      width: 36px;
      height: 36px;
      background: var(--navy);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .doc-icon svg { color: var(--white); }

    .doc-info { flex: 1; }

    .doc-title {
      font-size: 0.9em;
      font-weight: 600;
      color: var(--navy);
    }

    .doc-sub {
      font-size: 0.78em;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .doc-arrow { color: var(--text-muted); }

    /* ====== RELATED CASES ====== */
    .related-section {
      margin-top: 28px;
    }

    .related-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .related-label {
      font-size: 0.72em;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .related-line { flex: 1; height: 1px; background: var(--border); }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    a.related-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    a.related-card:hover {
      border-color: var(--navy);
      box-shadow: 0 2px 10px rgba(26,46,74,0.07);
    }

    .related-card-number {
      font-family: 'Playfair Display', serif;
      font-size: 0.95em;
      font-weight: 600;
      color: var(--navy);
    }

    .related-card-meta {
      font-size: 0.78em;
      color: var(--text-muted);
    }

    .related-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .related-tag {
      font-size: 0.68em;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: var(--gold-pale);
      color: var(--navy);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 20px;
      padding: 1px 8px;
    }

    .related-reason {
      font-size: 0.72em;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 2px;
    }

    /* ====== NAVIGATION LINKS ====== */
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.85em;
      color: var(--text-muted);
      transition: border-color 0.15s, color 0.15s;
    }

    .nav-link:hover { border-color: var(--navy); color: var(--navy); }
  </style>
</head>

<body>
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-title">CLIC</div>
      <div class="brand-sub">International Criminal Law</div>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Search CLIC
      </a>
      <a href="../legislation.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M5 6h6M5 9h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Legislation
      </a>
      <a href="../about.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7v5M8 5.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        About CLIC
      </a>
      <a href="../resources.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M3 8h7M3 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Other Resources
      </a>
    </nav>
    <div class="sidebar-footer"><span>Case Law Database</span></div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <div class="page-header">
      <div class="eyebrow">Case Detail</div>
      <h1 id="case-title">Loading…</h1>
    </div>

    <div class="content-area">

      <!-- METADATA GRID -->
      <div class="meta-grid" id="case-metadata">
        <!-- populated by JS -->
      </div>

      <!-- ABSTRACT -->
      <div class="section-card" id="abstract-card" style="display:none;">
        <div class="section-card-header">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="1" stroke="#1a2e4a" stroke-width="1.5"/><path d="M5 6h6M5 9h4" stroke="#1a2e4a" stroke-width="1.5" stroke-linecap="round"/></svg>
          <h2>Overview</h2>
        </div>
        <div class="section-card-body" id="abstract-text"></div>
      </div>

      <!-- DOCUMENTS -->
      <div class="section-card" id="downloads-card" style="display:none;">
        <div class="section-card-header">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v8M5 7l3 3 3-3" stroke="#1a2e4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12h10" stroke="#1a2e4a" stroke-width="1.5" stroke-linecap="round"/></svg>
          <h2>Documents</h2>
        </div>
        <div class="doc-list" id="case-downloads"></div>
      </div>

      <!-- RELATED CASES -->
      <div class="related-section" id="related-section" style="display:none;">
        <div class="related-header">
          <span class="related-label">Related Cases</span>
          <div class="related-line"></div>
        </div>
        <div class="related-grid" id="related-grid"></div>
      </div>

      <!-- BACK NAVIGATION -->
      <div class="nav-links" id="nav-links" style="margin-top:28px;">
        <!-- populated by JS -->
      </div>

    </div>
  </div>
</div>

<script>
  const caseId = "clic-0002";

  const titleEl      = document.getElementById("case-title");
  const metadataEl   = document.getElementById("case-metadata");
  const abstractCard = document.getElementById("abstract-card");
  const abstractText = document.getElementById("abstract-text");
  const downloadsCard= document.getElementById("downloads-card");
  const downloadsEl  = document.getElementById("case-downloads");
  const navLinks     = document.getElementById("nav-links");

  fetch("./index.json")
    .then(r => r.json())
    .then(cases => {
      const c = cases.find(item => item.id === caseId);

      if (!c) {
        titleEl.textContent = "Case not found";
        return;
      }

      titleEl.textContent = c.clic_number;

      // --- Crime tags ---
      const crimes = Array.isArray(c.crime_issue) ? c.crime_issue : [c.crime_issue];
      const tagHTML = crimes.map(cr => `<span class="crime-tag">${cr}</span>`).join("");

      // --- Area of law tags ---
      const areas = Array.isArray(c.area_of_law) ? c.area_of_law : [c.area_of_law].filter(Boolean);
      const areaHTML = areas.map(a =>
        `<span class="crime-tags-row" style="display:inline-flex;align-items:center;font-size:0.75em;font-weight:600;letter-spacing:0.04em;background:#eef4fb;color:#1a3a5c;border:1px solid #bed0e8;border-radius:20px;padding:3px 11px;">${a}</span>`
      ).join(' ');

      // --- Metadata grid ---
      metadataEl.innerHTML = `
        <div class="meta-cell">
          <div class="meta-label">Country</div>
          <div class="meta-value">${c.country}</div>
        </div>
        <div class="meta-cell">
          <div class="meta-label">Court</div>
          <div class="meta-value">${c.court}</div>
        </div>
        <div class="meta-cell">
          <div class="meta-label">Decision Date</div>
          <div class="meta-value">${c.decision_date}</div>
        </div>
        <div class="meta-cell">
          <div class="meta-label">Source</div>
          <div class="meta-value">${
            c.link
              ? `<a href="${c.link}" target="_blank" rel="noopener">View source ↗</a>`
              : `<em style="color:var(--text-muted);font-weight:400;">Not available</em>`
          }</div>
        </div>
        <div class="meta-cell" style="border-right: none;">
          <div class="meta-label">Crime / Issue</div>
          <div class="meta-value">
            <div class="crime-tags-row">${tagHTML}</div>
          </div>
        </div>
        ${areaHTML ? `
        <div class="meta-cell" style="grid-column: 1 / -1; border-right: none; border-top: 1px solid var(--border);">
          <div class="meta-label">Area of Law</div>
          <div class="meta-value">
            <div class="crime-tags-row">${areaHTML}</div>
          </div>
        </div>` : ''}
      `;

      // --- Abstract ---
      if (c.abstract_text) {
        abstractText.textContent = c.abstract_text;
        abstractCard.style.display = "block";
      }

      // --- Downloads ---
      const docs = [];
      if (c.abstract_pdf) docs.push({ href: `../${c.abstract_pdf}`, title: "Abstract (English)", sub: "PDF document" });
      if (c.full_pdf)     docs.push({ href: `../${c.full_pdf}`,     title: "Full Decision (Original Language)", sub: "PDF document" });

      if (docs.length > 0) {
        docs.forEach(doc => {
          downloadsEl.innerHTML += `
            <a class="doc-item" href="${doc.href}" target="_blank">
              <div class="doc-icon">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M4 2h6l4 4v8H4V2z" stroke="white" stroke-width="1.2"/><path d="M10 2v4h4" stroke="white" stroke-width="1.2"/><path d="M6 9h4M6 12h2" stroke="white" stroke-width="1.2" stroke-linecap="round"/></svg>
              </div>
              <div class="doc-info">
                <div class="doc-title">${doc.title}</div>
                <div class="doc-sub">${doc.sub}</div>
              </div>
              <div class="doc-arrow">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </a>
          `;
        });
        downloadsCard.style.display = "block";
      }

      // --- Nav links ---
      const backLinks = [
        { href: `../countries/${c.country.toLowerCase().replace(/ /g, '_')}.html`, label: c.country },
        { href: `../index.html`, label: "Homepage" },
      ];

      if (Array.isArray(c.crime_issue)) {
        c.crime_issue.forEach(cr => {
          backLinks.unshift({ href: `../crimes/${cr.toLowerCase().replace(/ /g, '_')}.html`, label: cr });
        });
      } else {
        backLinks.unshift({ href: `../crimes/${c.crime_issue.toLowerCase().replace(/ /g, '_')}.html`, label: c.crime_issue });
      }

      navLinks.innerHTML = backLinks.map(l => `
        <a class="nav-link" href="${l.href}">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back to ${l.label}
        </a>
      `).join("");

      // --- Related cases ---
      const thisCrimes  = new Set(crimes);
      const thisCountry = c.country;
      const thisAreas   = new Set(areas);

      // Score each other case by relatedness
      const scored = cases
        .filter(other => other.id !== caseId)
        .map(other => {
          const otherCrimes = Array.isArray(other.crime_issue) ? other.crime_issue : [other.crime_issue];
          const otherAreas  = Array.isArray(other.area_of_law) ? other.area_of_law : [other.area_of_law].filter(Boolean);
          const sharedCrimes = otherCrimes.filter(cr => thisCrimes.has(cr));
          const sharedAreas  = otherAreas.filter(a => thisAreas.has(a));
          const sameCountry  = other.country === thisCountry;

          let score = 0;
          let reasons = [];

          if (sharedCrimes.length > 0) {
            score += sharedCrimes.length * 3;
            reasons.push(`Shared crime: ${sharedCrimes.join(', ')}`);
          }
          if (sameCountry) {
            score += 2;
            reasons.push('Same country');
          }
          if (sharedAreas.length > 0) {
            score += sharedAreas.length;
            reasons.push(`Shared area: ${sharedAreas.join(', ')}`);
          }

          return { case: other, score, reasons, sharedCrimes, sameCountry };
        })
        .filter(s => s.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 4);

      if (scored.length > 0) {
        const grid = document.getElementById('related-grid');
        scored.forEach(({ case: rel, reasons, sharedCrimes }) => {
          const relCrimes = Array.isArray(rel.crime_issue) ? rel.crime_issue : [rel.crime_issue];
          const tags = relCrimes.map(cr =>
            `<span class="related-tag" style="${sharedCrimes.includes(cr) ? 'background:var(--navy);color:white;border-color:var(--navy)' : ''}">${cr}</span>`
          ).join('');

          const link = document.createElement('a');
          link.className = 'related-card';
          link.href = `../${rel.case_url}`;
          link.innerHTML = `
            <div class="related-card-number">${rel.clic_number}</div>
            <div class="related-card-meta">${rel.country} · ${rel.court} · ${rel.decision_date}</div>
            <div class="related-card-tags">${tags}</div>
            <div class="related-reason">${reasons.join(' · ')}</div>
          `;
          grid.appendChild(link);
        });
        document.getElementById('related-section').style.display = 'block';
      }
    })
    .catch(err => {
      titleEl.textContent = "Error loading case";
      console.error(err);
    });
</script>
</body>
</html>
